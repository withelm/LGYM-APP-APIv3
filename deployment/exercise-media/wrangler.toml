# Neutral example. Copy to ignored wrangler.local.toml and fill operator values.
# One binding is selected by this Worker's corresponding backend configuration.
name = "YOUR_WORKER_NAME"
main = "worker.mjs"
compatibility_date = "2026-11-09"
workers_dev = false
preview_urls = false
routes = []

[vars]
EXPECTED_HOST = "media.example.invalid"

[[r2_buckets]]
binding = "EXERCISE_MEDIA"
bucket_name = "YOUR_EXERCISE_MEDIA_BUCKET"
